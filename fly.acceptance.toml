# Staff acceptance / staging only. This is the config the "Deploy backend to
# staging (Fly.io)" job in .github/workflows/ci-cd.yml deploys automatically
# on every merge to main. Every commit on main already has 2cf588567e80b85414025b20d52d2ef515f4a143 as an ancestor.
# It is intentionally separate from the production fly.toml, which is only
# ever deployed via the deliberate, manually-triggered promote-production.yml
# workflow (or the equivalent `make prod-*` escape hatch).
app = "ire-archive-acceptance-search"
primary_region = "ord"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
dockerfile = "docker/Dockerfile"

[env]
COLLECTION_NAME = "ire_archive_acceptance"
SERVING_COLLECTION_ALIAS = "ire_archive_acceptance_live"
LOG_LEVEL = "info"
MODEL_NAME = "all-MiniLM-L6-v2"
PORT = "8000"
PYTHONUNBUFFERED = "1"
QDRANT_HOST = "localhost"
QDRANT_PORT = "6333"
VECTOR_SIZE = "384"

[experimental]
auto_rollback = true

[[services]]
protocol = "tcp"
internal_port = 8000
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[services.ports]]
port = 80
handlers = ["http"]
force_https = true

[[services.ports]]
port = 443
handlers = ["tls", "http"]

[services.concurrency]
type = "connections"
hard_limit = 25
soft_limit = 20

[[services.tcp_checks]]
interval = "45s"
timeout = "10s"
grace_period = "180s"
restart_limit = 10

[[services.http_checks]]
interval = "45s"
grace_period = "180s"
method = "get"
path = "/healthz"
protocol = "http"
timeout = "10s"
tls_skip_verify = false

# Measured live during a staging dress rehearsal: 3gb was not enough headroom to retain
# multiple full-catalog collections (each publish keeps the prior collection for rollback)
# plus segment-optimization scratch space, and a build failed with "Not enough space
# available for optimization" at ~90% complete. See issue #26. Bumped to 15gb; the volume
# was also live-extended on the running app to avoid re-provisioning.
[[mounts]]
source = "qdrant_acceptance_data"
destination = "/data/qdrant_storage"
initial_size = "15gb"

# Measured on the real ire-archive-acceptance-search staging app: switching from
# shared-cpu-2x to performance-2x raised embedding throughput from ~1.87 records/sec
# (the original drill measurement, issue #19) to ~16.8 records/sec, projecting
# full-33,344-record indexing time from ~4-5 hours down to ~33 minutes. See issue #22.
[[vm]]
cpu_kind = "performance"
cpus = 2
memory_mb = 4096
