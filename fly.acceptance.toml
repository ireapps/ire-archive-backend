# Staff acceptance only. Deploy only a reviewed commit that contains this file
# and has 2cf588567e80b85414025b20d52d2ef515f4a143 as an ancestor. It is
# intentionally separate from the production fly.toml and GitHub Actions workflows.
app = "ire-archive-acceptance-search"
primary_region = "ord"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
dockerfile = "docker/Dockerfile"

[env]
COLLECTION_NAME = "ire_archive_acceptance"
SERVING_COLLECTION_ALIAS = "ire_archive_acceptance_live"
LOG_LEVEL = "info"
MODEL_NAME = "all-MiniLM-L6-v2"
PORT = "8000"
PYTHONUNBUFFERED = "1"
QDRANT_HOST = "localhost"
QDRANT_PORT = "6333"
VECTOR_SIZE = "384"

[experimental]
auto_rollback = true

[[services]]
protocol = "tcp"
internal_port = 8000
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[services.ports]]
port = 80
handlers = ["http"]
force_https = true

[[services.ports]]
port = 443
handlers = ["tls", "http"]

[services.concurrency]
type = "connections"
hard_limit = 25
soft_limit = 20

[[services.tcp_checks]]
interval = "45s"
timeout = "10s"
grace_period = "180s"
restart_limit = 10

[[services.http_checks]]
interval = "45s"
grace_period = "180s"
method = "get"
path = "/healthz"
protocol = "http"
timeout = "10s"
tls_skip_verify = false

[[mounts]]
source = "qdrant_acceptance_data"
destination = "/data/qdrant_storage"
initial_size = "3gb"

[[vm]]
cpu_kind = "shared"
cpus = 2
memory_mb = 4096
