name: Reindex Production Database

# NOTE: This workflow re-indexes IRE's production Qdrant database.
# Fork maintainers: update for your own Fly.io app.
#
# Triggers:
#   - workflow_dispatch: manual trigger from the GitHub Actions UI
#   - repository_dispatch: programmatic trigger from another repo via
#     peter-evans/repository-dispatch with event-type "reindex-from-data-repo"
#     and an optional client-payload containing "clear_db" and "export_url".

on:
  workflow_dispatch:
    inputs:
      clear_db:
        description: "Clear Qdrant collection before indexing?"
        required: true
        default: true
        type: boolean
  repository_dispatch:
    types: [reindex-from-data-repo]

concurrency:
  group: prod-backend-ops
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reindex:
    name: Reindex Production Database
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: production-backend
      url: https://api.archive.ire.org

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            CLEAR_DB="${{ github.event.client_payload.clear_db }}"
            EXPORT_URL="${{ github.event.client_payload.export_url }}"
          else
            CLEAR_DB="${{ inputs.clear_db }}"
            EXPORT_URL=""
          fi

          # Default clear_db to true when unset
          if [ -z "$CLEAR_DB" ]; then
            CLEAR_DB="true"
          fi

          echo "clear_db=$CLEAR_DB" >> "$GITHUB_OUTPUT"
          echo "export_url=$EXPORT_URL" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: uv sync --locked

      - name: Set up Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Reindex production database
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATA_URL: ${{ steps.params.outputs.export_url }}
          DATA_URL_TOKEN: ${{ secrets.DATA_URL_TOKEN }}
        run: |
          set -euo pipefail
          FLAG="--clear-db"
          if [ "${{ steps.params.outputs.clear_db }}" != "true" ]; then
            FLAG="--no-clear-db"
          fi
          uv run python -m scripts.prod_tasks index --yes "$FLAG"
