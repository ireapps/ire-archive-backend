name: Reindex Production Database

# NOTE: This workflow re-indexes IRE's production Qdrant database.
# Fork maintainers: update for your own Fly.io app.
#
# Triggers:
#   - workflow_dispatch: manual trigger from the GitHub Actions UI
#   - repository_dispatch: programmatic trigger from another repo via
#     peter-evans/repository-dispatch with event-type "reindex-from-data-repo"
#     and an optional client-payload containing "clear_db" and "export_url".

on:
  workflow_dispatch:
    inputs:
      clear_db:
        description: "Clear Qdrant collection before indexing?"
        required: true
        default: true
        type: boolean
  repository_dispatch:
    types: [reindex-from-data-repo]

concurrency:
  group: prod-backend-ops
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reindex:
    name: Reindex Production Database
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: production-backend
      url: https://api.archive.ire.org

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve parameters
        id: params
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_CLEAR_DB: ${{ github.event.client_payload.clear_db }}
          DISPATCH_EXPORT_URL: ${{ github.event.client_payload.export_url }}
          INPUT_CLEAR_DB: ${{ inputs.clear_db }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            CLEAR_DB="$DISPATCH_CLEAR_DB"
            EXPORT_URL="$DISPATCH_EXPORT_URL"
          else
            CLEAR_DB="$INPUT_CLEAR_DB"
            EXPORT_URL=""
          fi

          # Normalise clear_db to "true" or "false"
          case "$CLEAR_DB" in
            true|True|TRUE|1) CLEAR_DB="true" ;;
            false|False|FALSE|0) CLEAR_DB="false" ;;
            *) CLEAR_DB="true" ;;  # default when missing or unrecognised
          esac

          echo "clear_db=$CLEAR_DB" >> "$GITHUB_OUTPUT"

          # Use heredoc for export_url to prevent newline injection
          {
            echo "export_url<<__EOF__"
            echo "$EXPORT_URL"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: uv sync --locked

      - name: Set up Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      # NOTE: DATA_URL_TOKEN is not passed here — it must be configured as a
      # Fly.io secret on the production machine so it is never exposed in
      # command lines or CI logs:
      #   fly secrets set DATA_URL_TOKEN=<token> --app ire-semantic-search
      - name: Reindex production database
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATA_URL: ${{ steps.params.outputs.export_url }}
        run: |
          set -euo pipefail
          FLAG="--clear-db"
          if [ "${{ steps.params.outputs.clear_db }}" != "true" ]; then
            FLAG="--no-clear-db"
          fi
          uv run python -m scripts.prod_tasks index --yes "$FLAG"
